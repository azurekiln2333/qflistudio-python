name: Native Android build

on:
  push:
    paths:
      - "native/**"
      - "LICENSE"
      - "android/app/build.gradle.kts"
      - ".github/workflows/native-build.yml"
  pull_request:
    paths:
      - "native/**"
      - "LICENSE"
      - "android/app/build.gradle.kts"
      - ".github/workflows/native-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android ${{ matrix.abi }} library
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64]
    env:
      NDK_VERSION: "27.0.12077973"
      CMAKE_VERSION: "3.22.1"
      ANDROID_API: "24"
      TARGET_ABI: ${{ matrix.abi }}
    steps:
      - name: Check out tracked native inputs
        uses: actions/checkout@v4

      - name: Install pinned Android build tools
        shell: bash
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION"

      - name: Build Android native library
        shell: bash
        run: |
          ndk="$ANDROID_HOME/ndk/$NDK_VERSION"
          cmake_bin="$ANDROID_HOME/cmake/$CMAKE_VERSION/bin"
          "$cmake_bin/cmake" -S native/android -B native/build/android -G Ninja \
            "-DCMAKE_MAKE_PROGRAM=$cmake_bin/ninja" \
            "-DCMAKE_TOOLCHAIN_FILE=$ndk/build/cmake/android.toolchain.cmake" \
            "-DANDROID_ABI=$TARGET_ABI" "-DANDROID_PLATFORM=android-$ANDROID_API" \
            -DANDROID_STL=c++_static -DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON \
            -DCMAKE_BUILD_TYPE=Release
          "$cmake_bin/cmake" --build native/build/android --target qfli_py --parallel 2

      - name: Inspect ELF dependencies and 16 KiB alignment
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re
          import subprocess

          readelf = pathlib.Path(os.environ['ANDROID_HOME']) / 'ndk' / os.environ['NDK_VERSION'] / 'toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf'
          library = pathlib.Path('native/build/android/libqfli_py.so')
          report = subprocess.check_output([str(readelf), '-h', '-l', '-d', '-W', str(library)], text=True)
          print(report)
          library.with_name('elf-report.txt').write_text(report, encoding='utf-8')
          needed = set(re.findall(r'\(NEEDED\).*?\[(.*?)\]', report))
          unexpected = needed - {'libc.so', 'libm.so', 'libdl.so', 'liblog.so'}
          if unexpected:
              raise SystemExit(f'Unexpected dynamic dependencies: {sorted(unexpected)}')
          loads = [line.split() for line in report.splitlines() if line.strip().startswith('LOAD ')]
          if not loads or any(int(fields[-1], 16) < 16384 for fields in loads):
              raise SystemExit('Every ELF LOAD segment must use at least 16 KiB alignment')
          print('PASS Android dependencies and 16 KiB ELF alignment')
          PY

      - name: Stage Android artifact
        shell: bash
        run: |
          mkdir -p build/native-artifact
          cp native/build/android/libqfli_py.so native/build/android/elf-report.txt \
            LICENSE native/LICENSE-MicroPython build/native-artifact/
          {
            echo "target=android-$TARGET_ABI"
            echo "build_type=Release"
            echo "android_api=$ANDROID_API"
            echo "ndk=$NDK_VERSION"
            echo "commit=$GITHUB_SHA"
            echo "run=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            "$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version
            "$ANDROID_HOME/cmake/$CMAKE_VERSION/bin/cmake" --version
          } > build/native-artifact/BUILD_INFO.txt
          cd build/native-artifact
          sha256sum libqfli_py.so BUILD_INFO.txt elf-report.txt LICENSE LICENSE-MicroPython > SHA256SUMS

      - name: Upload Android native library
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-android-${{ matrix.abi }}
          path: build/native-artifact/
          if-no-files-found: error
          retention-days: 14

      - name: Summarize Android artifact
        shell: bash
        env:
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          {
            echo "### Android $TARGET_ABI native library"
            echo
            echo "[Download native-android-$TARGET_ABI]($ARTIFACT_URL)"
            echo
            echo 'Contents: libqfli_py.so, BUILD_INFO.txt, SHA256SUMS, elf-report.txt and licenses.'
            echo
            echo 'Retention: 14 days. This library is not an APK installer.'
            echo 'Validation: ELF dependencies and 16 KiB LOAD alignment. Device runtime was not tested.'
          } >> "$GITHUB_STEP_SUMMARY"
