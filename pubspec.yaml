name: qfli_python
description: "QFLIPyFlow：手机上的 Python IDE，本地解释执行。"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  qfli_studio_core:
    path: ../qfli_studio_core

  qfli_python_native:
    path: native

  ffi: ^2.1.4
  archive: ^4.3.0
  crypto: ^3.0.7

  cupertino_icons: ^1.0.8

  # python_runner.dart 用它做路径处理（p.extension / p.basename / p.join）。
  # 不显式声明的话 flutter analyze 会报 depend_on_referenced_packages——
  # 只是靠传递依赖拿到了包，哪天上游不带了就编不过。
  path: ^1.9.1

dependency_overrides:
  re_editor:
    path: ../qfli_studio_core/vendor/re_editor

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.png
    - assets/python_stdlib/
